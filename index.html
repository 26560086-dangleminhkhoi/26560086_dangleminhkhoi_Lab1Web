<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Flip Card Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Flip Card Gallery</h1>
    <p class="subtitle">Hover a card to see the back</p>

    <div class="gallery-container">
        
        <div class="card">
            <div class="card-inner">
                <div class="card-front">
                    <div class="icon">📡</div>
                    <h2>HTML</h2>
                </div>
                <div class="card-back">
                    <h3>Ngôn ngữ đánh dấu</h3>
                    <p>Tạo cấu trúc web</p>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-inner">
                <div class="card-front">
                    <div class="icon">🎨</div>
                    <h2>CSS</h2>
                </div>
                <div class="card-back">
                    <h3>Ngôn ngữ định dạng</h3>
                    <p>Trang trí giao diện</p>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-inner">
                <div class="card-front">
                    <div class="icon">⚡</div>
                    <h2>JavaScript</h2>
                </div>
                <div class="card-back">
                    <h3>Ngôn ngữ lập trình</h3>
                    <p>Xử lý logic, tương tác</p>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
